[tool.ruff]
# Only the code paths this project actually lints in CI. Tests are
# intentionally excluded here — they have their own, much noisier set of
# patterns (fixtures, mocks) that would need a separate pass to evaluate
# properly; scope was Pyflakes parity for custom_components/roomba_plus,
# not a project-wide lint rollout.
include = ["custom_components/roomba_plus/*.py"]

[tool.ruff.lint]
# F = Pyflakes rule family — deliberately the ONLY rule set enabled.
# This matches exactly what the project's manual pyflakes checks already
# covered (session: v3.4.2 cleanup + CI review), so switching tooling
# doesn't silently expand scope. Formatting (ruff format / style rules
# like E-series) is explicitly out of scope — see the CI job comment for
# why: a project-wide style pass is a separate, much bigger decision the
# maintainer hasn't made yet, not something to bundle in here.
select = ["F"]

# No per-file or blanket ignores here, deliberately: every current
# exception (sensor.py's ~58 deliberate SENSOR-SPLIT facade re-exports,
# and 19 TYPE_CHECKING forward-reference false positives across
# dirt_threshold_manager.py / map_renderer.py / mission_map.py /
# models.py / repairs.py) is annotated inline with `# noqa: F401` /
# `# noqa: F821` and a one-line reason, right at the specific line it
# applies to — not hidden in this config file. A new genuinely-unused
# import or variable anywhere else has nothing to suppress it and will
# be caught.

[tool.pytest.ini_options]
# ASYNC FIXTURES NEED THIS. `pytest-homeassistant-custom-component`
# ships `hass` as an async fixture; under strict mode a test marked
# `@pytest.mark.asyncio` still receives the async generator rather than
# the instance, and fails with `'async_generator' object has no
# attribute ...` several frames later.
#
# Auto mode resolves them. It also makes the explicit `asyncio` markers
# throughout the suite redundant rather than wrong.
asyncio_mode = "auto"

# SET EXPLICITLY, because pytest-asyncio warns once per run that its
# default will change and that leaving it unset is deprecated. "function"
# is the current default, so this pins today's behaviour rather than
# choosing anything new -- the point is that the next release cannot
# change it silently.
asyncio_default_fixture_loop_scope = "function"

# WARNINGS ARE ERRORS, for the two kinds this suite had.
#
# It ran with 41 warnings for a long time, 31 of them "coroutine ... was
# never awaited". None turned out to be a real bug -- every unawaited
# call in the integration itself is correctly inside async_create_task --
# but that is only knowable after chasing all of them.
#
# The point of the gate is what happens next: a warning that is always
# there is one nobody reads, and a REAL missing await looks exactly the
# same. Production code that drops a coroutine reaches a robot with a
# command that silently does nothing, which is the failure mode this
# project has already shipped once, in 4.1.0.
#
# Scoped to these two rather than `error` for everything: a
# DeprecationWarning from Home Assistant or a dependency is not this
# project's to fix, and would block the suite on somebody else's
# release schedule.
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    # ASSERTS ON SOMETHING NOT FIELD-CONFIRMED.
    #
    # A green test states a fact. When the fact is a guess, the test
    # preserves the guess: `assert call.body_json == {"assetId": ...}`
    # stayed green for months on a wire key nobody had ever confirmed.
    # The real key is `robot_id`, found by tracing a native format
    # string.
    #
    # Nothing about that test looked wrong. It had a plausible value, a
    # clear name and a passing result -- and it made the assumption
    # harder to question, not easier, because questioning it meant
    # arguing with a green test.
    #
    # Usage: @pytest.mark.assumed("what is unconfirmed, and what would
    # settle it"). The reason is not optional -- "unconfirmed" without
    # saying what would confirm it is how a marker becomes decoration.
    #
    # These tests still run and still have to pass. The marker changes
    # nothing at runtime; it makes the set enumerable, so a field report
    # that confirms a format can be traced to the tests that guessed at
    # it.
    "assumed(reason): asserts on a value that is not field-confirmed",
]
