name: CodeQL

# Separate from validate.yml deliberately — CodeQL's own runtime (several
# minutes for the analysis step alone) shouldn't slow down the fast
# hacs/hassfest/test/lint/translations/blueprints feedback loop on every
# push. Weekly schedule catches drift from dependency updates even with
# no code changes; PR/push-to-main still covers actual code changes
# promptly.
#
# Motivated by this project handling real cloud credentials and auth
# tokens (Gigya login flow, AWS Cognito, custom IoT authorizer token
# handling in cloud_api.py) — exactly the kind of code where a static
# security scan is worth having, even for a Home Assistant custom
# integration that isn't itself internet-facing.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"  # Mondays, offset from validate.yml's nightly run
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # SCAN WHAT SHIPS. There is more test code than integration
          # code here -- 89k lines against 71k -- so without this the
          # majority of every scan is fixtures.
          #
          # Test files legitimately contain things CodeQL flags and
          # should flag elsewhere: hardcoded sample credentials, test
          # BLIDs, broad excepts, assert-based control flow. None of it
          # reaches a user.
          #
          # `scripts/` stays in scope on purpose: those run in CI, read
          # files and shell out, so a finding there is worth seeing.
          config: |
            paths-ignore:
              - tests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
