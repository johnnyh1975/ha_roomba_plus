# mypy --strict, in its own workflow so it can carry a badge.
# See hacs.yml for why this is a separate file rather than a job.
#
# WHY THIS ONE IS BADGED AT ALL. Strict typing is a real Platinum
# requirement in Home Assistant's quality scale, and it is the only one
# of them that a README badge can actually evidence. The "Quality Scale:
# Gold" badge next to it is self-awarded -- nothing verifies it for a
# custom integration, because the scale is defined for core integrations
# and no reviewer grades this repository. This badge is different: it
# reports whether a real check passed on real code, and the ratchet
# baseline is 0.
name: Typing

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typing:
    name: Typing (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      # pycares IS PINNED, and only on this combination.
      #
      # Home Assistant 2025.5.2 requires aiodns==3.4.0, which declares
      # `pycares>=4.0.0` with no upper bound. pycares 5.0.0 removed
      # `ares_query_a_result`, which aiodns 3.4.0 names in its own type
      # annotations at class-definition time -- so a fresh install picks
      # the newest pycares and `import aiohttp` raises AttributeError
      # before a single test is collected.
      #
      # The 2026.8 job is unaffected: its newer HA pins an aiodns that
      # allows pycares 5. So this is not a general pin, it belongs to
      # the minimum-version job.
      #
      # This is also the thing requirements-test-frozen.txt was doing
      # that its own comments never claimed: it froze TRANSITIVE
      # dependencies. Removing it in 4.2 was right about the HA version
      # it pinned and wrong about what else it held still.
      - name: Install Home Assistant 2025.5 and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==0.13.245" \
                      "pycares==4.11.0" \
                      aiohttp pillow

      - name: Install roombapy and roombapy-prime
        run: |
          pip install "roombapy==2.0.1" "roombapy-prime[map]==0.3.4"

      # mypy.ini runs --strict with no disabled error codes. The two
      # per-module exemptions are for Home Assistant itself and are
      # explained where they are declared.
      #
      # The ratchet script rather than a bare `mypy` call: it fails on
      # an increase AND on an undeclared decrease, so a fix that lowers
      # the count has to lower the recorded baseline in the same commit
      # rather than drifting silently. The baseline is 0.
      - name: Run mypy
        run: python scripts/check_typing_baseline.py
