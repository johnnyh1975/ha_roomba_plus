rules:
  # ── Bronze ────────────────────────────────────────────────────────────────
  action-setup:
    status: done
    comment: >
      All services (reset_filter, reset_brush, reset_battery, reset_pad,
      clean_room, smart_start) registered in async_setup_entry, not at
      module level.
  appropriate-polling:
    status: done
    comment: >
      Integration is local_push (MQTT). Cloud coordinator polls on a 24h
      interval — appropriate for slowly-changing pmap/favorites data.
  brands:
    status: done
    comment: >
      Brand assets (icon.png, icon@2x.png) ship in the inline brand/ directory.
      Since HA 2026.3 the inline brand/ directory is the supported mechanism and
      a separate PR to github.com/home-assistant/brands is no longer required.
  common-modules:
    status: done
    comment: >
      entity.py (IRobotEntity base), models.py (RoombaData, MapCapability),
      const.py (all constants), separate store modules for mission/maintenance/
      zone/geometry data.
  config-flow:
    status: done
    comment: Full config flow with DHCP/Zeroconf discovery and options flow.
  config-flow-test-coverage:
    status: done
    comment: >
      20 tests in tests/test_config_flow.py (stub-based, no HA install
      required) — kept out of the main tests/ run
      (--ignore=tests/test_config_flow.py, same exclusion as
      test_rest980_migrate.py) and run standalone. Covers
      async_migrate_entry (v1→v2), config flow error handling, reconfigure
      flow (form display + cannot_connect error), and options flow menu
      routing + settings save. Note: this comment previously described a
      separate tests_integration/ directory with its own pytest.ini; that
      no longer exists in the current tree — corrected v3.4.2.
  dependency-transparency:
    status: done
    comment: roombapy==1.9.1 pinned in manifest.requirements.
  docs-actions:
    status: done
    comment: >
      services.yaml documents all 6 actions with field descriptions, selectors,
      and examples. README actions table added in v2.0.
  docs-configuration-parameters:
    status: done
    comment: >
      README Configuration parameters section documents all options: connection
      settings, map, blocking sensors, presence scheduling, cloud credentials,
      and reconfiguration flow.
  docs-installation-instructions:
    status: done
    comment: README covers HACS and manual install.
  entity-event-setup:
    status: done
    comment: >
      All entity state updates driven by roombapy MQTT callbacks via
      new_state_filter + schedule_update_ha_state(). No polling in entities.
  entity-unique-id:
    status: done
    comment: All entities set _attr_unique_id in __init__.
  has-entity-name:
    status: done
    comment: All entities use translation_key + strings.json — no hardcoded names.
  runtime-data:
    status: done
    comment: >
      All runtime state in config_entry.runtime_data (RoombaData dataclass).
      No hass.data[DOMAIN] usage anywhere.
  test-before-setup:
    status: done
    comment: >
      MQTT connection established and confirmed before async_setup_entry
      returns. Cloud coordinator failure is caught and logged — local MQTT
      always succeeds or raises ConfigEntryNotReady.
  unique-config-entry:
    status: done
    comment: BLID used as unique_id in config flow — prevents duplicate entries.

  # ── Silver ────────────────────────────────────────────────────────────────
  action-exceptions:
    status: done
    comment: Services raise ServiceValidationError with translation keys.
  config-entry-unloading:
    status: done
    comment: async_unload_entry implemented — unloads all platforms cleanly.
  docs-supported-functions:
    status: done
    comment: >
      README features section documents all 69 local + 28 cloud sensors,
      binary sensors, controls, maps, zones, and v2.0 cloud diagnostics.
      REST API section documents both format=summary and format=records.
  entity-translations:
    status: done
    comment: >
      102 entity keys across sensor, binary_sensor, select, button platforms.
      8 languages (EN/DE/FR/ES/IT/NL/PT/PL). All keys present in strings.json
      and all translation files.
  integration-owner:
    status: done
    comment: codeowners set in manifest.
  log-when-unavailable:
    status: done
    comment: >
      Disconnect logged by roombapy at WARNING level. Reconnect attempts
      logged at INFO. Cloud failures logged at WARNING.
  parallel-updates:
    status: done
    comment: >
      PARALLEL_UPDATES = 0 set in all 7 platform files (vacuum, sensor,
      binary_sensor, select, button, image, switch). MQTT push integration
      — entities update independently via callbacks, no coordinator polling.
  reauthentication-flow:
    status: done
    comment: Cloud coordinator raises ConfigEntryAuthFailed on auth failure.
  test-coverage:
    status: done
    comment: >
      3937 tests across 56 test files (was 2712/45 — stale since before
      v3.4.2; corrected v3.4.2). Stub-based — no HA install required.
      Covers all stores, sensors, cloud coordinator, services, callbacks,
      migration (v1→v13), classification, REST API, backfill, UmfAligner,
      device triggers, logbook, and wiring.

  # ── Gold ──────────────────────────────────────────────────────────────────
  devices:
    status: done
    comment: Single DeviceInfo per robot in IRobotEntity base class.
  diagnostics:
    status: done
    comment: diagnostics.py exposes full runtime state as downloadable JSON.
  discovery:
    status: done
    comment: DHCP (4 MAC prefixes) and Zeroconf discovery configured.
  docs-high-level-description:
    status: done
    comment: >
      README introduction updated for v2.0 — describes local-push architecture,
      Gold Quality Scale, v2.1 performance intelligence and repair issue scope, and version history.
  entity-category:
    status: done
    comment: >
      All non-primary entities use EntityCategory.DIAGNOSTIC or CONFIG.
      Primary vacuum control has no category (visible by default).
  entity-disabled-by-default:
    status: done
    comment: >
      Opt-in diagnostic sensors (nav_panics, cliff counters, battery_capacity,
      rssi, snr, ip_address) set entity_registry_enabled_default=False.
  exception-translations:
    status: done
    comment: >
      All ServiceValidationError raises use translation_key= (v2.4.0 F-RB-7).
      Keys: entity_not_found, maintenance_store_unavailable, no_valid_segments
      added in v2.4.0. All 9 exception keys defined in strings.json and
      be converted to translation_key pattern in v2.4.0 (F-RB-7).
  icon-translations:
    status: done
    comment: >
      icons.json created with 98 entity icons across sensor (75), button (14),
      select (6), and switch (3) platforms. All _attr_icon and icon= assignments
      removed from entity files — icons served via frontend translation system.
  reconfiguration-flow:
    status: done
    comment: >
      async_step_reconfigure implemented — users can change host/password without
      removing the entry. Validates connection before applying. Reloads entry on success.
  repair-issues:
    status: done
    comment: repairs.py raises RepairIssues for dock drift, unconfirmed zones, cloud auth.
  stale-devices:
    status: done
    comment: >
      async_remove_config_entry_devices implemented. Each config entry manages
      one robot device — any device presented for removal is safe to remove.
  strict-typing:
    status: done
    comment: >
      mypy --strict passes with no disabled error codes and no
      per-module exemptions for this integration's own code.

      It said `done` before anyone had run mypy: not installed, no
      config, no CI step. A first run reported **565** errors, and
      turning on the two codes that were initially deferred
      (`no-any-return`, `attr-defined`) took the real total past 800.

      What the pass actually found, beyond annotations: eleven runtime
      bugs no field report had surfaced. Three services that could
      never be invoked (their handlers took two arguments where Home
      Assistant passes one). `ms.records()` calling a property, killing
      a coverage pass on its first line. `roomba.start`, which
      roombapy does not have, in three whole-house start paths.
      `last_seen_segments` and `async_create_segments_issue`, which
      exist nowhere, read on every cloud refresh. A repair issue
      imported from `components.repairs`, which has no
      `async_create_issue`. Two backend methods defined only on the
      Prime subclass but called through the base type.

      In five of those, a test fixture supplied what the real class
      lacked -- the mock created the precondition production was
      missing.

      Two exemptions remain, both scoped to Home Assistant itself and
      both explained in mypy.ini: HA declares no `__all__` in its
      component modules, and `AddConfigEntryEntitiesCallback` is absent
      from the newest HA installable on Python 3.12 (tests/conftest.py
      shims it for the same reason).

      `scripts/check_typing_baseline.py` holds the count at zero.

  # ── Platinum ─────────────────────────────────────────────────────────────
  async-dependency:
    status: todo
    comment: >
      NOT MET, and this said `done` with the comment "roombapy is
      async-capable via paho-MQTT thread". A sync library driven from a
      thread is not an async dependency -- that is what the rule exists
      to exclude.

      Measured rather than argued: the pinned `roombapy==1.9.1` defines
      **61 functions and zero `async def`**. The Prime side is genuinely
      async (aiohttp throughout), so this fails on the Classic half
      only.

      The same file records the same mistake one rule up: strict-typing
      said `done` before anyone had run mypy, and the first run reported
      565 errors and eleven runtime bugs. A self-declared scale is worth
      what its last check was worth.

      CLEARS IN 4.1, as one step rather than as extra work. roombapy
      2.0's asynchronous rewrite is released (2.0.1) and this project
      contributed it; adopting it is the 4.1 milestone, and this rule
      falls with it. Until then Platinum is one rule short and the
      manifest correctly says `gold`.
  inject-websession:
    status: done
    comment: >
      Both dependencies take the Home Assistant session; neither creates
      its own. The Classic cloud path uses
      `async_get_clientsession(hass)` in `__init__.py`,
      `cloud_coordinator.py` and both config-flow entry points -- and
      `roombapy_prime.RestClient.__init__` takes `session` as its first
      REQUIRED parameter, so a Prime client physically cannot be built
      with a standalone one.

      The single `aiohttp.ClientSession()` in the tree is in
      roombapy-prime's own `diagnostics.py`, a standalone tool outside
      the integration's path.
  migration:
    status: done
    comment: >
      async_migrate_entry implemented. Config entry is at **version 25**.
      This entry said 13 until August 2026 -- twelve migrations out of date,
      because nothing checks it against config_flow.VERSION.
  test-before-configure:
    status: done
    comment: MQTT credentials verified during config flow before entry is created.
