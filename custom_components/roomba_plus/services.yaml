            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    time:
      selector:
        time:
    frequency:
      selector:
        select:
          options: [WEEKLY, BI_WEEKLY, MONTHLY, ONCE]
    rooms:
      example: '["Kitchen", "Hallway"]'
      selector:
        object:
    pad_wetness:
      selector:
        number:
          min: 1
          max: 3
          mode: slider
    enabled:
      selector:
        boolean:

