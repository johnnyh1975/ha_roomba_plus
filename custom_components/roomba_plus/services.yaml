run_favorite:
  target:
    entity:
      integration: roomba_plus
      domain: vacuum
  fields:
    favorite_id:
      required: true
      example: "01KRQ4S1RP493P1WKCG71C90D9"
      selector:
        text:

create_schedule:
  target:
    entity:
      integration: roomba_plus
      domain: vacuum
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: roomba_plus
          domain: vacuum
    name:
      example: Kitchen, weekday mornings
      selector:
        text:
    days:
      required: true
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    time:
      required: true
      selector:
        time:
    frequency:
      default: WEEKLY
      selector:
        select:
          options: [WEEKLY, BI_WEEKLY, MONTHLY, ONCE]
    rooms:
      example: '["Kitchen", "Hallway"]'
      selector:
        object:
    pad_wetness:
      selector:
        number:
          min: 1
          max: 3
          mode: slider
    enabled:
      default: true
      selector:
        boolean:

