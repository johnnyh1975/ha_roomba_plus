# The names and descriptions of the actions and their fields are in
# strings.json and the translations: one source, in every language.
clean_room:
  target:
    entity:
      integration: roomba_plus
      domain: vacuum
  fields:
    room_name:
      required: false
      example: "Kitchen"
      selector:
        text:
    ordered:
      required: false
      default: true
      selector:
        boolean:
    cleaning_mode:
      selector:
        select:
          options:
            - label: Vacuum
              value: vacuum
            - label: Mop
              value: mop
            - label: Vacuum and mop
              value: vacuum_and_mop
            - label: Vacuum, then mop
              value: vacuum_then_mop
    two_pass:
      required: false
      selector:
        boolean:
    smart_scrub:
      selector:
        boolean:
    pad_wetness:
      selector:
        select:
          options:
            - label: Light
              value: "1"
            - label: Standard
              value: "2"
            - label: Hard
              value: "3"
    room_passes:
      required: false
      example: '[{"name": "Kitchen", "two_pass": true}, {"name": "Hallway"}]'
      selector:
        object:

smart_start:
  target:
    entity:
      integration: roomba_plus
      domain: vacuum
  fields:
    rooms:
      required: false
      selector:
        text:
          multiple: true
    override_blocking:
      required: false
      default: false
      selector:
        boolean:

clean_sequence:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    target_entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    require_completed:
      required: false
      default: true
      selector:
        boolean:
    delay_minutes:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: min

reset_robot_profile:
  target:
    entity:
      integration: roomba_plus
      domain: vacuum

advance_room:
  target:
    entity:
      integration: roomba_plus
      domain: vacuum

explain_mission:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    mission_id:
      required: false
      selector:
        text:

retry_missed_rooms:
  fields:
    entity_id:
      required: true
